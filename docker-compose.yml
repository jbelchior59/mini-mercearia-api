services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_ISSUER: ${JWT_ISSUER:-secure-mini-ecommerce-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-secure-mini-ecommerce-client}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
    volumes:
      - sqlite-data:/data
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  sqlite-data:
  uploads-data:
