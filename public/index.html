<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini-Mercearia (Fruta)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header class="topbar">
      <h1>🍎 Mini-Mercearia</h1>

      <nav>
        <button class="tab-btn active" data-tab="produtos">Produtos</button>
        <button class="tab-btn" data-tab="carrinho">
          Carrinho (<span id="cart-count">0</span>)
        </button>
        <button class="tab-btn" data-tab="login">Login</button>
      </nav>
    </header>

    <main>
      <!-- PRODUTOS -->
      <section id="produtos" class="tab active">
        <h2>Fruta</h2>
        <p class="section-subtitle">Catálogo de fruta disponível</p>

        <!-- Pesquisa + filtros (extra) -->
        <div class="filters">
          <label>
            Pesquisar
            <input id="f-q" placeholder="ex.: banana, maçã, madura..." />
          </label>
          <label>
            Preço min
            <input id="f-min" type="number" step="0.01" min="0" placeholder="0" />
          </label>
          <label>
            Preço max
            <input id="f-max" type="number" step="0.01" min="0" placeholder="10" />
          </label>
<label>
            Ordenar
            <select id="f-sort">
              <option value="name_asc">Nome (A-Z)</option>
              <option value="price_asc">Preço (Ascendente)</option>
              <option value="price_desc">Preço (Descendente)</option>
              <option value="newest">Mais recentes</option>
            </select>
          </label>

          <label>
            Favoritos
            <input id="f-favs" type="checkbox" />
            <span class="muted">Só favoritos</span>
          </label>
        </div>

        <div id="produtos-fruta-list" class="grid grid-3-center"></div>
      </section>

      <!-- CARRINHO -->
      <section id="carrinho" class="tab">
        <h2>Carrinho</h2>

        <!-- Cupão destacado (tema presente) -->
        <div class="cart-coupon-badge" aria-label="Cupão WELCOME5">
          <div class="ccb-text">
            <div class="ccb-welcome">Bem vindo</div>
            <div class="ccb-main">Cupão <span class="ccb-code">WELCOME5</span></div>
            <div class="ccb-hint">use no check out</div>
          </div>
        </div>

        <div id="cart-items"></div>

        <div class="cart-summary">
          <div>
            Total: <strong id="cart-total">0.00 €</strong>
          </div>

          <details>
            <summary>Checkout</summary>

            <form id="checkout-form">
              <label>
                Nome
                <input name="name" required />
              </label>

              <label>
                Email
                <input type="email" name="email" placeholder="ex.: nome@exemplo.com" required />
              </label>

              <label>
                Contacto
                <input name="phone" required />
              </label>

              <label>
                Data (AAAA-MM-DD)
                <input name="date" placeholder="2025-12-20" required />
              </label>

              <label>
                Cupão (opcional)
                <input name="coupon" placeholder="ex.: NATAL10" />
              </label>

              <button type="submit" class="btn-confirm btn-checkout-large">Efetuar Encomenda</button>
            </form>

            <p id="checkout-msg"></p>
          </details>
        </div>
      </section>

      <!-- LOGIN -->
      <section id="login" class="tab">
        <div class="auth-screen">
          <div class="auth-card">
            <!-- Entrar -->
            <div id="auth-login-view">
              <h2 class="auth-title">Entrar</h2>

              <form id="login-form" class="auth-form">
                <label>
                  Email
                  <input type="email" name="email" required />
                </label>

                <label>
                  Password
                  <input type="password" name="password" required />
                </label>

                <button type="submit" class="btn-confirm auth-btn">Entrar</button>
              </form>

              <p id="login-msg" class="auth-msg"></p>

              <button id="to-register" type="button" class="auth-link">Criar conta</button>
            </div>

            <!-- Criar conta -->
            <div id="auth-register-view" class="auth-hidden">
              <h2 class="auth-title">Criar conta</h2>

              <form id="register-form" class="auth-form">
                <label>
                  Nome
                  <input type="text" name="name" required />
                </label>

                <label>
                  Email
                  <input type="email" name="email" required />
                </label>

                <label>
                  Password
                  <input type="password" name="password" required />
                </label>

                <button type="submit" class="btn-confirm auth-btn">Criar conta</button>
              </form>

              <p id="register-msg" class="auth-msg"></p>

              <button id="to-login" type="button" class="auth-link">Já tenho conta</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <small>© Mini-Mercearia — Projeto DAW</small>
    </footer>

    <script>
      window.__API_BASE__ = "";
    </script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
